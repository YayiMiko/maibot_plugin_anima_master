name: Offline checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maibot-plugin-sdk==2.8.2 "httpx>=0.28,<1" "requests>=2.32,<3" "pillow>=11,<13" "tomlkit>=0.13,<1" pytest ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m compileall -q -x "[.]git|[.]venv" .
      - run: git diff --check
