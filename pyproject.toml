[project]
name = "maibot-plugin-anima-master"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk==2.8.2", "httpx>=0.28,<1", "requests>=2.32,<3", "pillow>=11,<13", "tomlkit>=0.13,<1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = [".", "agent_tools"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
